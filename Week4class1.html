<!DOCTYPE html>
<html>
<head>
    <title>Buttons and Links</title>

    <style>
        .container {
            width: 320px;
            padding: 16px;
        }

        .row {
            height: 32px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 24px;
        }

        button {
            width: 100px;
            height: 32px;
            border-radius: 8px;
            background-color:black
        }

        a {
            color: blue;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="row">
            <button><a href="https://www.facebook.com">Facebook</a></button>
            
        </div>

        <div class="row">
            <button><a href="https://www.google.com">Google</a></button>
            
        </div>

    </div>

</body>
</html>
