    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
        body {
            margin: 0;

            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            width: 600px;
            margin: 50px auto;
        }

        .images {
            display: flex;
            gap: 12px;
        }

        .images img {
            width: 250px;
            height: 180px;
            object-fit: cover;
        }

        h1 {
            font-size: 36px;
            font-weight: bold;
            margin: 0;
        }

        p {
            font-size: 16px;
            text-align: center;
            margin: 0;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Two images side by side -->
        <div class="images">
            <img src="./images/5.jpg" alt="ABC Trek">
            <img src="./images/6.webp" alt="ABC Trek">
        </div>

        <!-- Title -->
        <h1>ABC Trek</h1>

        <!-- Description -->
        <p>
            ABC Trek is a beautiful trekking adventure through the mountains.
            It offers amazing views, fresh air, and an opportunity to explore
            nature. It is a great experience for people who love adventure
            and the outdoors.
        </p>

    </div>

</body>
